<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="262" viewBox="0 0 1000 262">
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0f20"/>
    <stop offset="1" stop-color="#070b18"/>
  </linearGradient>
  <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d3b35"/>
    <stop offset="1" stop-color="#0c1a17"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="1000" height="262" rx="16"/></clipPath>
</defs>
<style>
  .mote { animation: rise 9s linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .8 } 85% { opacity: .5 } 100% { transform: translateY(-140px); opacity: 0 } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  .fade { animation: fadein 2.5s ease-out both; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="262" fill="url(#page)"/>
<circle class="mote" cx="29.0" cy="141.4" r="1.7" fill="#d9f5e8" style="animation-delay:-3.29s" filter="url(#glow)"/>
<circle class="mote" cx="18.3" cy="143.2" r="1.6" fill="#d9f5e8" style="animation-delay:-2.17s" filter="url(#glow)"/>
<circle class="mote" cx="38.0" cy="255.2" r="1.8" fill="#d9f5e8" style="animation-delay:-5.25s" filter="url(#glow)"/>
<circle class="mote" cx="18.5" cy="258.9" r="1.2" fill="#d9f5e8" style="animation-delay:-7.73s" filter="url(#glow)"/>
<circle class="mote" cx="27.6" cy="206.2" r="1.7" fill="#d9f5e8" style="animation-delay:-6.14s" filter="url(#glow)"/>
<circle class="mote" cx="20.1" cy="180.4" r="1.7" fill="#d9f5e8" style="animation-delay:-0.57s" filter="url(#glow)"/>
<g class="fade">
<text x="500" y="58" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="30" font-style="italic" letter-spacing="2" fill="#f1ecff" filter="url(#glow)">The Calling</text>
<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11" letter-spacing="5" fill="#c9b8e8">· WHAT THE MAGE ACTUALLY DOES ·</text>
<line x1="70" y1="106" x2="930" y2="106" stroke="#2b2c55" stroke-width="1"/>
<text x="500" y="156" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="31" font-style="italic" fill="#8fd3b6" filter="url(#glow)">Embedded Systems &amp; Firmware Engineering</text>
<text x="500" y="196" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="14"><tspan fill="#c9b8e8">Full-stack Developer</tspan><tspan fill="#2b2c55" dx="14" dy="0">·</tspan><tspan dx="14"> </tspan><tspan fill="#c9b8e8">Salenga Law Firm</tspan><tspan fill="#2b2c55" dx="14" dy="0">·</tspan><tspan dx="14"> </tspan><tspan fill="#8a93a8">since August 2026</tspan></text>
<text x="500" y="226" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="13"><tspan fill="#8a93a8">BS Computer Engineering</tspan><tspan fill="#2b2c55" dx="14" dy="0">·</tspan><tspan dx="14"> </tspan><tspan fill="#8a93a8">President Ramon Magsaysay State University</tspan></text>
</g>
</g></svg>
