<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250">
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0f20"/>
    <stop offset="1" stop-color="#070b18"/>
  </linearGradient>
  <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d3b35"/>
    <stop offset="1" stop-color="#0c1a17"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="1000" height="250" rx="16"/></clipPath>
</defs>
<style>
  .mote { animation: rise 9s linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .8 } 85% { opacity: .5 } 100% { transform: translateY(-140px); opacity: 0 } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  .fade { animation: fadein 2.5s ease-out both; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="250" fill="url(#page)"/>
<circle class="mote" cx="952.5" cy="210.8" r="1.4" fill="#d9f5e8" style="animation-delay:-0.22s" filter="url(#glow)"/>
<circle class="mote" cx="957.0" cy="229.6" r="1.7" fill="#d9f5e8" style="animation-delay:-8.50s" filter="url(#glow)"/>
<circle class="mote" cx="51.3" cy="190.5" r="1.9" fill="#d9f5e8" style="animation-delay:-4.72s" filter="url(#glow)"/>
<circle class="mote" cx="35.4" cy="228.8" r="2.1" fill="#d9f5e8" style="animation-delay:-1.82s" filter="url(#glow)"/>
<circle class="mote" cx="19.3" cy="214.6" r="1.6" fill="#d9f5e8" style="animation-delay:-3.88s" filter="url(#glow)"/>
<circle class="mote" cx="52.9" cy="141.2" r="1.5" fill="#d9f5e8" style="animation-delay:-8.36s" filter="url(#glow)"/>
<g class="fade">
<text x="500" y="58" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="30" font-style="italic" letter-spacing="2" fill="#f1ecff" filter="url(#glow)">The Era Log</text>
<text x="500" y="84" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="11" letter-spacing="5" fill="#c9b8e8">· HOW LONG THE JOURNEY HAS RUN ·</text>
<line x1="70" y1="106" x2="930" y2="106" stroke="#2b2c55" stroke-width="1"/>
<text x="500" y="158" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="40" font-style="italic" fill="#8fd3b6" filter="url(#glow)">2 years, 8 months</text>
<text x="500" y="186" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="12" letter-spacing="1" fill="#8a93a8">since 1 February 2024</text>
<text x="500" y="220" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="15" font-style="italic" fill="#f6d98a" opacity="0.9">To an elf, an afternoon.</text>
</g>
</g></svg>
