<text x="375" y="168" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="38" font-style="italic" fill="#f1ecff" filter="url(#glow)">10</text><text x="375" y="194" text-anchor="middle" font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="10" letter-spacing="3" fill="#c9b8e8" opacity="0.9">PULL REQUESTS OPENED</text>
