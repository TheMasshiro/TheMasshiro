<circle class="mote" cx="963.9" cy="267.0" r="1.3" fill="#d9f5e8" style="animation-delay:-9.00s" filter="url(#glow)"/>
<circle class="mote" cx="965.2" cy="367.5" r="1.7" fill="#d9f5e8" style="animation-delay:-8.75s" filter="url(#glow)"/>
<circle class="mote" cx="28.1" cy="275.9" r="1.9" fill="#d9f5e8" style="animation-delay:-8.94s" filter="url(#glow)"/>
