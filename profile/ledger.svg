<circle class="mote" cx="977.7" cy="322.7" r="2.1" fill="#d9f5e8" style="animation-delay:-2.12s" filter="url(#glow)"/>
<circle class="mote" cx="947.9" cy="314.4" r="1.8" fill="#d9f5e8" style="animation-delay:-4.16s" filter="url(#glow)"/>
<circle class="mote" cx="964.4" cy="275.7" r="1.2" fill="#d9f5e8" style="animation-delay:-8.30s" filter="url(#glow)"/>
