<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390">
<defs>
  <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0f20"/>
    <stop offset="1" stop-color="#070b18"/>
  </linearGradient>
  <linearGradient id="meadow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d3b35"/>
    <stop offset="1" stop-color="#0c1a17"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="frame"><rect width="1000" height="390" rx="16"/></clipPath>
</defs>
<style>
  .mote { animation: rise 9s linear infinite; }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 15% { opacity: .8 } 85% { opacity: .5 } 100% { transform: translateY(-140px); opacity: 0 } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg) } 50% { transform: rotate(4deg) } }
  .fade { animation: fadein 2.5s ease-out both; }
  @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
</style>
<g clip-path="url(#frame)">
<rect width="1000" height="390" fill="url(#page)"/>
<circle class="mote" cx="958.3" cy="313.2" r="1.6" fill="#d9f5e8" style="animation-delay:-7.40s" filter="url(#glow)"/>
<circle class="mote" cx="945.0" cy="360.4" r="1.7" fill="#d9f5e8" style="animation-delay:-6.05s" filter="url(#glow)"/>
