name: Update profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    name: Draw the cards
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Optional PAT with read:user. Without it the meadow counts only public
      # contributions, which here is about two thirds of the real total.
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Draw the traveler's ledger
        run: python3 scripts/ledger.py ${{ github.repository_owner }}

      - name: Draw the meadow
        run: python3 scripts/meadow.py ${{ github.repository_owner }}

      - name: Redraw the era log
        run: python3 scripts/era-log.py

      - name: Hang tonight's moon
        run: python3 scripts/moon.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
